packages:
  - .
allowBuilds:
  '@sentry/cli': true
  sharp: true
  unrs-resolver: true
  # Pulled in by jest-haste-map; only `jest --watch` uses it, and its prebuilt
  # binaries ship as optional dependencies, so its install script is not needed.
  '@parcel/watcher': false
# Supply-chain guard: never install a package version that is less than a day
# old (pnpm 11+ default, pinned here so it does not depend on the pnpm version).
# This is what the image build runs with. For local testing right after an
# upgrade, override it for one command only:
#   pnpm_config_minimum_release_age=0 pnpm install
minimumReleaseAge: 1440
# Network: pnpm 11+ reads these here, not from .npmrc (which now only carries
# the registry for pnpm, and the fetch-* settings for the `npm install -g pnpm`
# step in the Containerfile). Same policy as .npmrc: fail a stuck request after
# 60s and retry soon (10s..60s backoff) rather than idling for minutes; the
# Containerfile retries the whole install 5 times on top.
fetchTimeout: 60000
fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
networkConcurrency: 8
