# The ONE place the enx-ui image build tools are pinned (ADR-055). Homelab
# Tekton and GitHub Actions both read this file, so both build with exactly
# the same builder and run image.
#
# Pinned by digest, not by tag: a tag can be moved to different content at any
# time, a digest cannot. To upgrade, look up the new digest of the tag in the
# comment and change it here only.

# heroku/builder:24 -- used only for its Ubuntu 24.04 build environment and the
# CNB lifecycle; its own buildpacks are not used (see cnb/nextjs-standalone).
ENX_CNB_BUILDER_IMAGE=docker.io/heroku/builder@sha256:2dbef1e3d94d9a1641a304725cbef24e95979cb2ee7bd327b0bbc5aa28028b34

# paketobuildpacks/ubuntu-noble-run-tiny:latest -- Ubuntu 24.04, glibc, no
# shell, ~11 MB. Must stay ABI-compatible with the builder (same Ubuntu).
ENX_CNB_RUN_IMAGE=docker.io/paketobuildpacks/ubuntu-noble-run-tiny@sha256:23148caef914968a78ae046d7e89ee380741a2a14cb247d41fd1edb74a3bddf3
