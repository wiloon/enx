<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">An English article: click a word and Catglish shows its meaning in a small card</title>
  <!-- browser window -->
  <rect x="0" y="0" width="480" height="360" rx="12" fill="#f1f3f4"/>
  <circle cx="20" cy="18" r="5" fill="#dadce0"/>
  <circle cx="36" cy="18" r="5" fill="#dadce0"/>
  <circle cx="52" cy="18" r="5" fill="#dadce0"/>
  <rect x="72" y="8" width="396" height="20" rx="10" fill="#ffffff" stroke="#dadce0"/>
  <text x="86" y="22" font-family="sans-serif" font-size="11" fill="#5f6368">news-site.com/science/coral-reefs</text>
  <!-- page -->
  <rect x="12" y="38" width="456" height="310" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <text x="36" y="72" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#202124">How coral reefs bounce back</text>
  <text x="36" y="104" font-family="Georgia, serif" font-size="13" fill="#3c4043">Scientists found that some reefs are surprisingly</text>
  <!-- the looked-up word -->
  <rect x="33" y="111" width="68" height="20" rx="3" fill="#00878F" fill-opacity="0.12"/>
  <text x="36" y="126" font-family="Georgia, serif" font-size="13" fill="#00878F" font-weight="bold">resilient</text>
  <line x1="36" y1="130" x2="98" y2="130" stroke="#00878F" stroke-width="2"/>
  <text x="106" y="126" font-family="Georgia, serif" font-size="13" fill="#3c4043">and recover within a decade.</text>
  <!-- cursor -->
  <path d="M78 128 l0 16 l4 -4 l3 7 l3 -1.5 l-3 -7 l5.5 0 z" fill="#202124" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- remaining text, faded -->
  <rect x="36" y="250" width="400" height="8" rx="4" fill="#e8eaed"/>
  <rect x="36" y="268" width="372" height="8" rx="4" fill="#e8eaed"/>
  <rect x="36" y="286" width="390" height="8" rx="4" fill="#e8eaed"/>
  <rect x="36" y="304" width="240" height="8" rx="4" fill="#e8eaed"/>
  <!-- popover -->
  <rect x="58" y="144" width="292" height="92" rx="8" fill="#000000" fill-opacity="0.08" transform="translate(0 3)"/>
  <rect x="58" y="144" width="292" height="92" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <path d="M72 144 l8 -8 l8 8" fill="#ffffff" stroke="#dadce0"/>
  <rect x="71" y="143" width="18" height="2" fill="#ffffff"/>
  <text x="72" y="168" font-family="sans-serif" font-size="15" font-weight="bold" fill="#202124">resilient</text>
  <text x="146" y="168" font-family="sans-serif" font-size="12" fill="#5f6368">/rɪˈzɪliənt/</text>
  <!-- speaker -->
  <path d="M204 160 h3 l4 -3.5 v11 l-4 -3.5 h-3 z M214 159.5 q3 3 0 6" fill="none" stroke="#5f6368" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="336" y="168" font-family="sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">×</text>
  <text x="72" y="192" font-family="sans-serif" font-size="13" fill="#202124">adj. 有复原力的；能迅速恢复的</text>
  <line x1="70" y1="206" x2="338" y2="206" stroke="#e8eaed"/>
  <!-- dictionary link: an open-book icon, no dictionary name -->
  <path d="M72 215.5 q4.5 -2 9 0 v12 q-4.5 -2 -9 0 z M81 215.5 q4.5 -2 9 0 v12 q-4.5 -2 -9 0" fill="none" stroke="#00878F" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="268" y="212" width="70" height="18" rx="3" fill="#00878F"/>
  <text x="303" y="225" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✓ Know It</text>
</svg>
