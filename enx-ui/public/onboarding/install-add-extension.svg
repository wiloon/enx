<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">The Add “Catglish”? dialog: click Add extension</title>
  <!-- browser window -->
  <rect x="0" y="0" width="480" height="360" rx="12" fill="#f1f3f4"/>
  <circle cx="20" cy="18" r="5" fill="#dadce0"/>
  <circle cx="36" cy="18" r="5" fill="#dadce0"/>
  <circle cx="52" cy="18" r="5" fill="#dadce0"/>
  <rect x="72" y="8" width="396" height="20" rx="10" fill="#ffffff" stroke="#dadce0"/>
  <text x="86" y="22" font-family="sans-serif" font-size="11" fill="#5f6368">chromewebstore.google.com/detail/catglish</text>
  <!-- the listing behind, faded -->
  <rect x="12" y="38" width="456" height="310" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <rect x="32" y="104" width="52" height="52" rx="12" fill="#00878F" fill-opacity="0.35"/>
  <rect x="100" y="112" width="96" height="12" rx="6" fill="#f1f3f4"/>
  <rect x="330" y="108" width="114" height="36" rx="18" fill="#0b57d0" fill-opacity="0.35"/>
  <rect x="32" y="178" width="196" height="112" rx="6" fill="#f8f9fa"/>
  <rect x="240" y="178" width="196" height="112" rx="6" fill="#f8f9fa"/>
  <!-- dialog hanging from the top of the window -->
  <rect x="100" y="34" width="300" height="164" rx="12" fill="#000000" fill-opacity="0.14" transform="translate(0 3)"/>
  <rect x="100" y="34" width="300" height="164" rx="12" fill="#ffffff" stroke="#dadce0"/>
  <defs>
    <!-- the Catglish mark, as in LogoMark.tsx and the store icon -->
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009ca5"/>
      <stop offset="1" stop-color="#006871"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 96 96">
      <rect width="96" height="96" rx="22" fill="url(#logo)"/>
      <path d="M41.1 35.3 23.6 14l1.3 28.8zM54.9 35.3 72.4 14l-1.3 28.8z" fill="#fff"/>
      <path d="M66.9 38.1A24.7 24.7 0 1 0 66.9 69.9" fill="none" stroke="#fff" stroke-width="13.1" stroke-linecap="round"/>
      <circle cx="55.5" cy="54" r="5" fill="#ffc83d"/>
    </symbol>
  </defs>
  <use href="#mark" x="120" y="54" width="24" height="24"/>
  <text x="154" y="71" font-family="sans-serif" font-size="16" font-weight="bold" fill="#202124">Add “Catglish”?</text>
  <text x="120" y="102" font-family="sans-serif" font-size="12" fill="#3c4043">It can:</text>
  <rect x="120" y="112" width="220" height="7" rx="3.5" fill="#e8eaed"/>
  <rect x="120" y="126" width="170" height="7" rx="3.5" fill="#e8eaed"/>
  <!-- buttons bottom right: Add extension is filled -->
  <rect x="192" y="152" width="70" height="32" rx="16" fill="#ffffff" stroke="#747775"/>
  <text x="227" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b57d0" text-anchor="middle">Cancel</text>
  <rect x="280" y="152" width="104" height="32" rx="16" fill="#0b57d0"/>
  <text x="332" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Add extension</text>
  <!-- highlight -->
  <rect x="273" y="145" width="118" height="46" rx="23" fill="none" stroke="#00878F" stroke-width="3"/>
  <!-- cursor -->
  <path d="M356 174 l0 16 l4 -4 l3 7 l3 -1.5 l-3 -7 l5.5 0 z" fill="#202124" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
