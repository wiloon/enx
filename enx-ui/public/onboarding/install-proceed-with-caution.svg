<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">The Proceed with caution dialog: click Continue to install</title>
  <!-- Temporary: remove with ENHANCED_PROTECTION_NOTE when #560 closes. -->
  <!-- browser window -->
  <rect x="0" y="0" width="480" height="360" rx="12" fill="#f1f3f4"/>
  <circle cx="20" cy="18" r="5" fill="#dadce0"/>
  <circle cx="36" cy="18" r="5" fill="#dadce0"/>
  <circle cx="52" cy="18" r="5" fill="#dadce0"/>
  <rect x="72" y="8" width="396" height="20" rx="10" fill="#ffffff" stroke="#dadce0"/>
  <text x="86" y="22" font-family="sans-serif" font-size="11" fill="#5f6368">chromewebstore.google.com/detail/catglish</text>
  <!-- the listing behind, dimmed -->
  <rect x="12" y="38" width="456" height="310" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <rect x="32" y="104" width="52" height="52" rx="12" fill="#00878F"/>
  <rect x="100" y="112" width="96" height="12" rx="6" fill="#e8eaed"/>
  <rect x="330" y="108" width="114" height="36" rx="18" fill="#0b57d0"/>
  <rect x="32" y="178" width="196" height="112" rx="6" fill="#f1f3f4"/>
  <rect x="240" y="178" width="196" height="112" rx="6" fill="#f1f3f4"/>
  <rect x="12" y="38" width="456" height="310" rx="8" fill="#202124" fill-opacity="0.45"/>
  <!-- dialog -->
  <rect x="80" y="82" width="320" height="180" rx="12" fill="#000000" fill-opacity="0.12" transform="translate(0 3)"/>
  <rect x="80" y="82" width="320" height="180" rx="12" fill="#ffffff"/>
  <!-- warning icon -->
  <path d="M112 102 l12 21 h-24 z" fill="#f9ab00"/>
  <rect x="111" y="109" width="2" height="7" fill="#ffffff"/>
  <rect x="111" y="118" width="2" height="2" fill="#ffffff"/>
  <text x="100" y="148" font-family="sans-serif" font-size="17" font-weight="bold" fill="#202124">Proceed with caution</text>
  <text x="100" y="172" font-family="sans-serif" font-size="12" fill="#3c4043">This extension is not trusted by Enhanced</text>
  <text x="100" y="188" font-family="sans-serif" font-size="12" fill="#3c4043">Safe Browsing.</text>
  <!-- buttons: Continue to install is outlined -->
  <rect x="140" y="214" width="148" height="32" rx="16" fill="#ffffff" stroke="#747775"/>
  <text x="214" y="234" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b57d0" text-anchor="middle">Continue to install</text>
  <rect x="306" y="214" width="78" height="32" rx="16" fill="#0b57d0"/>
  <text x="345" y="234" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancel</text>
  <!-- highlight -->
  <rect x="133" y="207" width="162" height="46" rx="23" fill="none" stroke="#00878F" stroke-width="3"/>
  <!-- cursor -->
  <path d="M258 236 l0 16 l4 -4 l3 7 l3 -1.5 l-3 -7 l5.5 0 z" fill="#202124" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
