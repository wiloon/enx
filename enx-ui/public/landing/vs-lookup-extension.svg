<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t">
  <title id="t">With a lookup extension a word you looked up looks like any other word the next time; with Catglish it comes back underlined</title>
  <style>
    /* Brand values match globals.css; the underline colour matches enx-chrome wordHighlight.ts. */
    svg { --brand: oklch(0.55 0.13 200); --brand-muted: oklch(0.95 0.03 200); --fg: oklch(0.145 0 0); --sub: oklch(0.45 0 0); --faint: oklch(0.9 0 0); --border: oklch(0.88 0 0); --bg: oklch(0.97 0 0); --card: #fff; --underline: oklch(0.45 0.13 305); }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .serif { font-family: Georgia, serif; }
    .sub { fill: var(--sub); }
    .brand { fill: var(--brand); }
  </style>
  <rect width="720" height="440" rx="14" fill="var(--bg)"/>
  <!-- column: lookup extension -->
  <text x="188" y="46" font-size="15" font-weight="700" text-anchor="middle" class="sub">A lookup extension</text>
  <rect x="24" y="64" width="328" height="352" rx="10" fill="var(--card)" stroke="var(--border)"/>
  <text x="44" y="94" font-size="11" font-weight="600" class="sub" letter-spacing="0.6">TODAY</text>
  <text x="44" y="122" class="serif" font-size="15">Some reefs are surprisingly</text>
  <text x="44" y="144" class="serif" font-size="15"><tspan font-weight="bold">resilient</tspan> and recover fast.</text>
  <rect x="44" y="156" width="208" height="52" rx="8" fill="var(--card)" stroke="var(--border)"/>
  <text x="56" y="178" font-size="13" font-weight="700">resilient</text>
  <text x="56" y="197" font-size="12" class="sub">adj. 有复原力的</text>
  <path d="M44 232h288" stroke="var(--border)" stroke-dasharray="4 4"/>
  <text x="44" y="260" font-size="11" font-weight="600" class="sub" letter-spacing="0.6">NEXT WEEK, ANOTHER PAGE</text>
  <text x="44" y="288" class="serif" font-size="15">Small towns proved more</text>
  <text x="44" y="310" class="serif" font-size="15">resilient than expected.</text>
  <text x="44" y="384" font-size="14" class="sub">The popup closed. The word is gone.</text>
  <!-- column: Catglish -->
  <text x="532" y="46" font-size="15" font-weight="700" text-anchor="middle" class="brand">Catglish</text>
  <rect x="368" y="64" width="328" height="352" rx="10" fill="var(--card)" stroke="var(--brand)" stroke-width="1.5"/>
  <text x="388" y="94" font-size="11" font-weight="600" class="sub" letter-spacing="0.6">TODAY</text>
  <text x="388" y="122" class="serif" font-size="15">Some reefs are surprisingly</text>
  <text x="388" y="144" class="serif" font-size="15"><tspan font-weight="bold">resilient</tspan> and recover fast.</text>
  <rect x="388" y="156" width="208" height="52" rx="8" fill="var(--card)" stroke="var(--border)"/>
  <text x="400" y="178" font-size="13" font-weight="700">resilient</text>
  <text x="400" y="197" font-size="12" class="sub">adj. 有复原力的</text>
  <path d="M388 232h288" stroke="var(--border)" stroke-dasharray="4 4"/>
  <text x="388" y="260" font-size="11" font-weight="600" class="sub" letter-spacing="0.6">NEXT WEEK, ANOTHER PAGE</text>
  <text x="388" y="288" class="serif" font-size="15">Small towns proved more</text>
  <text x="388" y="310" class="serif" font-size="15">resilient than expected.</text>
  <path d="M388 316h54" stroke="var(--underline)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="388" y="328" width="112" height="22" rx="11" fill="var(--brand-muted)"/>
  <text x="444" y="343" font-size="11" font-weight="600" text-anchor="middle" class="brand">looked up 1 time</text>
  <text x="388" y="384" font-size="14" font-weight="600">It comes back underlined.</text>
</svg>
