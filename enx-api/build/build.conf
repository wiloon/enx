# The ONE place the enx-api image build tools are pinned (ADR-056). Homelab
# Tekton and GitHub Actions both read this file, so both build with exactly
# the same Go, ko and base image.
#
# Images are pinned by digest, not by tag: a tag can be moved to different
# content at any time, a digest cannot. To upgrade, look up the new digest of
# the tag in the comment and change it here only.

# golang:1.27.3 -- keep in step with the `go` directive in go.mod. Also the
# step image the build runs in.
ENX_GO_IMAGE=docker.io/library/golang@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b

# github.com/google/ko, fetched as a Go module (`go run ...@version`), so the
# module proxy and go.sum checksum DB verify it like any other dependency.
ENX_KO_VERSION=v0.19.1

# paketobuildpacks/ubuntu-noble-run-static:latest -- Ubuntu 24.04, CA certs,
# tzdata and /tmp; no shell, no libc. Runs as 1002:1001, the same user as the
# enx-ui image.
ENX_BASE_IMAGE=docker.io/paketobuildpacks/ubuntu-noble-run-static@sha256:39f3dc123f0f5bbd69c3db554bffa3824a71537dfb2b3432ea424b01fd884ff1
