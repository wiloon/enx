[enx]
dev-mode = true
port = 8091

[data-service]
address = "localhost:50051"

[mysql]
address = "mysql.wiloon.com:3306"

[sync]
# minute
duration = 60

[news]
expire-time = "-720h"
gc-duration = "24h"

[log]
level = "debug"
path = "/data/rssx/logs/"
file-name = "rssx.log"

[ecdict]
db_path = ""
# ADR-030 Decision 0: temporary lookup sampling. When true, every dictionary
# lookup and every multi-word selection emits one DICTSAMPLE line (see the
# `dictsample` package) so the ECDICT miss rate and the phrase hit rate stop
# being guesses. Carries no user id. Time-boxed: turn it on for ~2 weeks,
# analyse with scripts/dictsample-report.sh, then turn it off and delete the
# package. Off by default. Env: ECDICT_SAMPLING.
sampling = false

[resend]
# api-key must be set via RESEND_API_KEY env var, never in this file.
# admin-to (RESEND_ADMIN_TO): where new page reports are emailed (ADR-010 Decision 12).
# Empty = skip notify (same "unconfigured but not fatal" pattern as api-key).
from = "Catglish <no-reply@catglish.com>"

[app]
frontend-base-url = "https://enx.wiloon.lab"

[clerk]
# Clerk Frontend API origin; also the `iss` claim on every session token, and
# the base for the JWKS endpoint (<issuer>/.well-known/jwks.json).
# This is the Clerk *development* instance (rational-deer-4450). The production
# instance has its own domain (clerk.catseye.* / custom); set CLERK_ISSUER in
# that deployment's env to override. Empty -> ClerkAuth returns 503.
issuer = "https://rational-deer-4450.clerk.accounts.dev"
# Allow-list checked against the token `azp` claim (the origin the token was
# minted for): the enx-ui origin(s) plus the extension id
# (chrome-extension://<id>, fixed by the "key" in enx-chrome/manifest.json).
# Override per-deployment with CLERK_AUTHORIZED_PARTIES (space-separated).
authorized-parties = ["https://enx.wiloon.lab", "http://localhost:3000", "chrome-extension://combdcldlodkikjfhjbdbogjlfmnbjkf"]

[sentence-translate]
# "kimi" | "bedrock" | "minimax" | "deepseek" | "gemini" -- switch provider by
# changing this one line, or override per-deployment with the
# SENTENCE_TRANSLATE_PROVIDER env var. Left blank in this checked-in template:
# each deployment (homelab k8s, AWS EC2, local dev) sets its own value, since
# the right provider depends on where this is actually running. Empty means the
# feature stays disabled (POST /api/translate/sentence responds 502) rather
# than failing to start. API keys are never set here; see KIMI_API_KEY /
# MINIMAX_API_KEY / DEEPSEEK_API_KEY / GEMINI_API_KEY env vars, and the AWS
# credential chain (IAM instance role on EC2) for bedrock.
provider = ""
# Per-call timeout for the provider API request (Go duration string).
# Default 60s: MiniMax's M-series models spend time "thinking" before the
# first response byte, and the old hard-coded 10s timed out on rephrase.
# Override with SENTENCE_TRANSLATE_REQUEST_TIMEOUT.
request-timeout = "60s"

[sentence-translate.kimi]
model = "moonshot-v1-8k"
# rephrase-model (ADR-012): rephrase-only override. Empty = use `model`.
# Rephrase output is longer than a translation and its input cap will grow,
# so a deployment can point rephrase at a larger-context model here without
# touching translation. Override with SENTENCE_TRANSLATE_KIMI_REPHRASE_MODEL.
rephrase-model = ""
base-url = "https://api.moonshot.cn/v1"

[sentence-translate.bedrock]
region = "us-east-1"
model-id = "anthropic.claude-3-5-haiku-20241022-v1:0"

[sentence-translate.minimax]
model = "MiniMax-Text-01"
# International account (platform.minimax.io): https://api.minimax.io/v1
# China account   (platform.minimaxi.com): https://api.minimaxi.com/v1
# The key namespace differs per platform -- a China key against api.minimax.io
# 401s ("invalid api key (2049)"). Override per-deploy with
# SENTENCE_TRANSLATE_MINIMAX_BASE_URL.
base-url = "https://api.minimax.io/v1"

[sentence-translate.deepseek]
model = "deepseek-chat"
# rephrase-model (mirrors kimi's): rephrase-only override. Empty = use `model`.
rephrase-model = ""
# One unified endpoint -- unlike MiniMax/Kimi, DeepSeek has no separate
# international/China account or base URL. Override with
# SENTENCE_TRANSLATE_DEEPSEEK_BASE_URL only for a self-hosted/proxy setup.
base-url = "https://api.deepseek.com"

[sentence-translate.gemini]
# OpenAI-compatible Gemini endpoint (Google AI Studio API key).
# Override with SENTENCE_TRANSLATE_GEMINI_MODEL / _BASE_URL.
model = "gemini-3.6-flash"
# rephrase-model (mirrors kimi's): rephrase-only override. Empty = use `model`.
rephrase-model = ""
base-url = "https://generativelanguage.googleapis.com/v1beta/openai"

[stripe]
# Publishable key is designed to be public and safe to check in.
# STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET are env-var only, never here
# (same convention as KIMI_API_KEY / RESEND_API_KEY).
publishable-key = ""

[stripe.price]
# Stripe Price lookup_keys, not raw Price IDs. lookup_keys are stable across
# Sandbox/Live -- the underlying Price ID differs per Stripe mode, the
# lookup_key doesn't -- so billing/stripe/checkout.go should resolve Price by
# lookup_key via the Stripe API rather than hardcoding an ID. Catalog is
# managed via OpenTofu in infra/stripe/opentofu/enx (w10n-config, private).
#
# Three subscription tiers (2026-08-26 decision, replacing the original
# single "enx Pro" monthly/annual structure) -- annual billing is deferred
# ("单独讨论"), not dropped: see infra/stripe/opentofu/enx/main.tf.
pro = "enx_pro_monthly"
pro-plus = "enx_pro_plus_monthly"
max = "enx_max_monthly"
credits-topup-small = "enx_credits_topup_small"
credits-topup-medium = "enx_credits_topup_medium"
credits-topup-large = "enx_credits_topup_large"

[stripe.credits]
# AI credits granted per grant event (subscription renewal / top-up
# purchase). All placeholders -- 0 means "not decided yet", and the ledger
# (billing/credit) deliberately REJECTS a grant of 0 rather than silently
# under-crediting a paying customer, so billing/webhook.go's
# invoice.paid/checkout.session.completed handlers will fail (Stripe
# retries, visible in the Dashboard) until these are filled in. See
# w10n-config/enx/monetization.md for the pricing discussion and
# TASK-SPEC §10.2: PRs should not merge with these still at 0 if billing is
# meant to go live.
#
# 2026-09-17: provisional values set so the production deployment can take a
# real subscription without the ledger refusing the grant. They are NOT
# calibrated -- [stripe.costs.*] below is still at placeholder weights, so
# "1 credit" does not yet correspond to a measured cost. Re-derive both
# together once there is real `aitranslate: usage ... cost=` data
# (LAUNCH-CHECKLIST §1.2).
#
# Shape: credits-per-dollar rises with the tier (125 / 150 / 200), so
# upgrading is always better value than stacking top-ups.
#   Pro    $3.99  ->  500
#   Pro+   $9.99  -> 1500
#   Max   $19.99  -> 4000
subscription-pro = 500
subscription-pro-plus = 1500
subscription-max = 4000
# Top-ups never expire, so they are priced slightly worse per credit than the
# cheapest subscription (~100-115/$ vs 125/$).
#   small  $2.99  ->  300
#   medium $6.99  ->  750
#   large $12.99  -> 1500
topup-small = 300
topup-medium = 750
topup-large = 1500

[stripe.costs.translate]
# AI translation (整句翻译 / 上下文词义 / 整句+词义合并) is billed by ACTUAL
# token usage (ADR-014), replacing the earlier fixed 1-credit-per-call
# (ADR-009 Decision 4). The three features share one model and a
# near-identical token profile, so one price fits all three.
# cost = ceil((prompt_tokens*weight-in + completion_tokens*weight-out)
# / divisor), floored at 1. divisor <= 0 or both weights 0 means "not
# priced yet" and the endpoints respond 502. Values below are placeholders
# pending pricing review; calibrate from the `cost=` field in the usage log
# lines. Override with STRIPE_COSTS_TRANSLATE_WEIGHT_IN / _WEIGHT_OUT /
# _DIVISOR.
weight-in = 1
weight-out = 3
divisor = 3000

[stripe.costs.rephrase]
# Rephrase (ADR-012) is billed by ACTUAL token usage, not a fixed per-call
# cost -- the first feature to do so, and the groundwork for site-wide token
# billing. cost = ceil((prompt_tokens*weight-in + completion_tokens*weight-out)
# / divisor), floored at 1. weight-out > weight-in because providers price
# output tokens higher and the completion (idiomatic + alternatives + notes)
# is the larger, more variable part. divisor <= 0 or both weights 0 means
# "not priced yet" and the endpoint responds 502 (same convention as a
# <= 0 fixed cost). Values below are placeholders pending pricing review;
# calibrate from the `cost=` field in the usage log lines. Override with
# STRIPE_COSTS_REPHRASE_WEIGHT_IN / _WEIGHT_OUT / _DIVISOR.
weight-in = 1
weight-out = 3
divisor = 3000

[stripe.quota]
# Daily dictionary lookup ceilings, one per tier (ADR-029). Everyone is
# counted; the tier only decides the number. 0 means "count, but never
# block" -- unlike the cost/credit values above, an unconfigured quota fails
# open, because failing closed would break the free-tier hook for everyone
# (see w10n-config/enx/monetization.md).
#
# Both at 0 is the launch state: observe real usage for a few weeks, then
# set numbers (LAUNCH-CHECKLIST §1.5). `-subscribed` is an abuse ceiling,
# not a product tier -- set it high enough that normal use never reaches it.
#
# Superseded key `dictionary-lookup-daily` still works as a fallback for
# `-free` for one release.
dictionary-lookup-daily-free = 0
dictionary-lookup-daily-subscribed = 0
