# Air configuration for hot reload development
# https://github.com/cosmtrek/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Always the repo's config.toml: without -c, viper prefers
  # /usr/local/etc/enx/ and ~/.enx/, and a stale config there (no [clerk])
  # makes every signed-in request 503 "auth service unavailable".
  args_bin = ["-c", "config.toml"]
  entrypoint = ["./tmp/enx-api"]
  cmd = "go build -o ./tmp/enx-api ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "deploy", "test", "examples"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "toml"]
  include_file = []
  kill_delay = "3s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
