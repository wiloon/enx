<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hidden Article</title>
  </head>
  <body>
    <!-- Readability skips aria-hidden content, so it finds no article text
         here, while the article selector still matches. -->
    <article aria-hidden="true">
      <p>
        This article is hidden from assistive technology, so Mozilla
        Readability drops it before scoring candidates and returns no article
        at all, while the extension's article selector still matches it.
      </p>
    </article>
  </body>
</html>
