<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Sentence Translate Fixture</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 280px;
      margin: 40px auto;
      padding: 16px;
      line-height: 1.5;
      font-size: 18px;
    }
    body.dark {
      background: #111;
      color: #eee;
    }
    article p {
      margin: 0 0 1em;
    }
  </style>
</head>
<body>
  <article>
    <h1>Harbor Light</h1>
    <p id="wrap">
      The early morning light settled across the quiet harbor while small boats
      waited near the weathered pier for the tide to turn again.
    </p>
    <p id="next">
      Later the crew gathered on the deck and spoke about the weather forecast.
    </p>
  </article>
</body>
</html>
