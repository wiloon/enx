allowBuilds:
  # ADR-015 (Clerk) deps: all postinstall scripts are console messages or
  # optional native accelerators with pure-JS fallbacks — nothing we need built.
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  utf-8-validate: false
  # jest 30 deps: @parcel/watcher is only used by `jest --watch` and
  # unrs-resolver's script just checks for a prebuilt binary (shipped as an
  # optional dependency). Neither needs its install script.
  '@parcel/watcher': false
  unrs-resolver: false
# Supply-chain guard: never install a package version that is less than a day
# old (pnpm 11+ default, pinned here so it does not depend on the pnpm version).
# This is what the image build runs with. For local testing right after an
# upgrade, override it for one command only:
#   pnpm_config_minimum_release_age=0 pnpm install
minimumReleaseAge: 1440
peerDependencyRules:
  allowedVersions:
    # ws@7 (under Clerk's Solana wallet deps -> react-native dev-middleware)
    # peers utf-8-validate ^5, but rpc-websockets pulls in 6. ws accepts 6's
    # API (a plain function export), it is an optional native accelerator we
    # never build (allowBuilds above), and none of this code reaches the
    # extension bundle.
    ws>utf-8-validate: '6'
