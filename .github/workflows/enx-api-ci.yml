name: enx-api CI

# Local mirror: `task ci:api`. A check added here must be added there too.

# Lint and unit tests for enx-api on every PR that touches it, and on main.
# Integration tests (//go:build integration) are not run here: they need the
# ECDICT database and a real app database. Run them locally with
# `task test-integration`.

on:
  pull_request:
    paths:
      - 'enx-api/**'
      - '.github/workflows/enx-api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'enx-api/**'
      - '.github/workflows/enx-api-ci.yml'

permissions:
  contents: read

concurrency:
  group: enx-api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: enx-api

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: enx-api/go.mod
          cache-dependency-path: enx-api/go.sum
      # goinstall builds golangci-lint with the Go above: a prebuilt binary
      # made with an older Go refuses to lint a go 1.27 module. Keep the
      # version in step with GOLANGCI_LINT_VERSION in enx-api/Taskfile.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: enx-api
      - name: golangci-lint (integration build tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: enx-api
          args: --build-tags=integration

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: enx-api/go.mod
          cache-dependency-path: enx-api/go.sum
      - run: go vet ./...
      # Compiles the integration tests without running them.
      - run: go vet -tags=integration ./...
      - run: go test ./...

  image:
    name: ko image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ADR-056: the same enx-api/build/build.sh as homelab Tekton and the
      # production release, in the golang image pinned in build/build.conf.
      # Builds only; nothing is pushed.
      - id: conf
        run: echo "go-image=$(sed -n 's/^ENX_GO_IMAGE=//p' build/build.conf)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/enx-api-go
          key: enx-api-go-${{ steps.conf.outputs.go-image }}-${{ hashFiles('enx-api/go.sum') }}
          restore-keys: enx-api-go-${{ steps.conf.outputs.go-image }}-
      - name: Build
        env:
          ENX_PUSH: "0"
          VERSION: ci
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: build/docker-build.sh ci.invalid/enx-api:ci
