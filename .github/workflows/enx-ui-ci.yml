name: enx-ui CI

# Builds the enx-ui image exactly as a release does (ADR-055: enx-ui/cnb/
# build.sh in the builder pinned in enx-ui/cnb/images.conf) and smoke-tests
# it with runtime env vars only. Nothing is pushed: no registry, no cache,
# no AWS credentials, so this also runs on PRs from any branch.

on:
  pull_request:
    paths:
      - 'enx-ui/**'
      - '.github/workflows/enx-ui-ci.yml'
  push:
    branches: [main]
    paths:
      - 'enx-ui/**'
      - '.github/workflows/enx-ui-ci.yml'

permissions:
  contents: read

jobs:
  # Lint and unit tests. The image build below typechecks (next build) but
  # runs neither.
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: enx-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: enx-ui/.node-version

      - name: Enable pnpm (corepack, packageManager in package.json)
        run: corepack enable

      # The committed .npmrc points at the homelab Nexus, which GitHub runners
      # can't reach.
      - name: Install
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  image:
    name: Build image (CNB) and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          ENX_NPM_REGISTRY: https://registry.npmjs.org/
          # Proves the version is baked into the image (#51); the smoke test
          # reads it back without passing it to the container.
          ENX_VERSION: ci-${{ github.sha }}
          ENX_GIT_COMMIT: ${{ github.sha }}
        run: enx-ui/cnb/docker-build.sh enx-ui:ci

      - name: Smoke test (runtime config only)
        env:
          SMOKE_VERSION: ci-${{ github.sha }}
        run: SMOKE_IMAGE=enx-ui:ci enx-ui/scripts/smoke-runtime.sh

      - name: Image size
        run: docker image inspect enx-ui:ci --format '{{.Size}}' | awk '{printf "enx-ui:ci %.1f MB (uncompressed)\n", $1/1e6}'
